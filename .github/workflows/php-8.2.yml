name: frankenphp:php8.2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: frankenphp
  VERSION: 1.13-php8.2-ubi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install podman
        run: |
          sudo apt update
          sudo apt install -y podman

      - name: Login GHCR with podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build OCI tar
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:8.2"
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=./image.tar
          tags: |
            ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Load OCI tar & push as zstd:chunked
        run: |
          podman load -i ./image.tar
          podman push \
            --force-compression \
            --compression-level 12 \
            --compression-format zstd:chunked \
            ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
